<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="login-card">
    
    <div class="illustration-side">
      <div class="character-container">
        <div class="character purple" id="char-purple">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
          </div>
          <div class="mouth"></div>
        </div>

        <div class="character orange" id="char-orange">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
          </div>
          <div class="mouth"></div>
        </div>

        <div class="character yellow" id="char-yellow">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>

    <div class="form-side">
      <div class="star-icon">✦</div>
      <h2>Welcome back</h2>
      <p class="subtitle">Please enter your details.</p>

      <form onsubmit="return false;">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="usmanaliamjad@gmail.com" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" />
            <i class="fa-regular fa-eye" id="togglePassword"></i>
          </div>
        </div>

        <div class="options-row">
          <label class="remember">
            <input type="checkbox" /> Remember for 30 days
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Log in</button>

        <button type="button" class="btn-google">
          <i class="fa-brands fa-google"></i> Log in with Google
        </button>
      </form>

      <p class="signup-text">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
