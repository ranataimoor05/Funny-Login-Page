<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Sign Up Page</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="login-card">
    
    <!-- Left Illustration Area -->
    <div class="illustration-side">
      <div class="character-container">
        <!-- Purple Tall Character -->
        <div class="character purple" id="char-purple">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div><div class="eyelid"></div></div>
            <div class="eye"><div class="pupil"></div><div class="eyelid"></div></div>
          </div>
          <div class="mouth"></div>
        </div>

        <!-- Orange Round Character -->
        <div class="character orange" id="char-orange">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div><div class="eyelid"></div></div>
            <div class="eye"><div class="pupil"></div><div class="eyelid"></div></div>
          </div>
          <div class="mouth"></div>
        </div>

        <!-- Yellow Tall Character -->
        <div class="character yellow" id="char-yellow">
          <div class="eyes">
            <div class="eye"><div class="pupil"></div><div class="eyelid"></div></div>
            <div class="eye"><div class="pupil"></div><div class="eyelid"></div></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>

    <!-- Right Form Area -->
    <div class="form-side">
      <!-- Toggle Tabs for Login & Sign Up -->
      <div class="form-tabs">
        <button class="tab-btn active" id="loginTab">Log In</button>
        <button class="tab-btn" id="signupTab">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active" onsubmit="return false;">
        <div class="star-icon">✦</div>
        <h2>Welcome back</h2>
        <p class="subtitle">Please enter your details.</p>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="usmanaliamjad@gmail.com" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="pwd-input" placeholder="••••••••" />
            <i class="fa-regular fa-eye-slash toggle-pwd" data-target="password"></i>
          </div>
        </div>

        <div class="options-row">
          <label class="remember">
            <input type="checkbox" /> Remember for 30 days
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Log in</button>

        <button type="button" class="btn-google">
          <i class="fa-brands fa-google"></i> Log in with Google
        </button>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signupForm" class="auth-form" onsubmit="return false;">
        <div class="star-icon">✦</div>
        <h2>Create an account</h2>
        <p class="subtitle">Sign up to get started.</p>

        <div class="input-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="John Doe" />
        </div>

        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="name@company.com" />
        </div>

        <div class="input-group">
          <label for="signup-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="signup-password" class="pwd-input" placeholder="••••••••" />
            <i class="fa-regular fa-eye-slash toggle-pwd" data-target="signup-password"></i>
          </div>
        </div>

        <button type="submit" class="btn-login">Create Account</button>

        <button type="button" class="btn-google">
          <i class="fa-brands fa-google"></i> Sign up with Google
        </button>
      </form>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
